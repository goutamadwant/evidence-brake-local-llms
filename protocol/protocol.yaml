  cut_order: 'Applied only if the measured throughput cannot finish before 18 November, recorded as a dated amendment and
    disclosed, and decided from throughput alone. The single cut: drop the group methods, so RQ4 is unanswered and the paper
    says so. Datasets, models, seeds, the six primary methods and the S_controls group are never cut.'
sensitivity_cells:
- id: S_controls
  methods:
  - gold_last
  - distractor_gold_last
  - reasoned_gold
  - reasoned_distractor_gold
  - skeptic
  requires_full: false
  scope:
    datasets:
    - fever
    - scifact
    seeds:
    - 1
    - 2
    - 3
    models:
    - qwen3-coder-30b-a3b-instruct
    - qwen/qwen3.6-35b-a3b
    - gemma-4-31b-it-qat
  purpose: Position, format and skepticism controls on a fixed 200 claims per dataset, arms alone, false, false_text. They
    answer the two alternative explanations of a negative C3 that the block order and the one-word format would otherwise
    leave open, and they place the cheap prompt alternative beside the evidence results.
headroom:
  metric_id: notes_drop
  pilot_threshold: 0.02
  pilot_rule: The pilot step computes min(notes_drop of no_context, notes_drop of distractor_retrieved) minus notes_drop of
    retrieved on the pilot scope and writes GO or FALLBACK against 2 points. The pilot standard error is about 4 points, so
    this value only chooses which pre-registered statement the manuscript leads with. Both outcomes run the identical matrix
    and the identical decision rules.
  pilot_scope:
    datasets:
    - fever
    seeds:
    - 101
    models:
    - qwen3-coder-30b-a3b-instruct
    baseline_methods:
    - no_context
    - distractor_retrieved
    claims: 200, by PAPER_LIMIT=200 (a fixed stride of the valid claims, 140 TRUE and 60 FALSE)
    note: Seed 101 is outside the matrix seeds, so pilot draws are a separate stream and never enter the analysis (artifact/analyze.py
      reads kinds full, baseline, sensitivity). The pilot claims overlap the frame; since the pilot changes no rule this cannot
      select a result.
  pilot_checks: artifact/pilot_checks.py writes experiments/pilot_checks.json with the values for the kill criteria below.
kill_criteria:
- 'Pilot: the no-context notes drop is below 5 points, so there is nothing to brake in the primary channel. The study is stopped.'
- 'Pilot: more than 5% of one-word answers of the pilot model are unparsed after one prompt repair. The model is replaced
  by amendment before any further cell; a second failure stops the study.'
- 'Frame: the retrieved block holds a full official evidence set for fewer than 25% of the claims of a dataset, so the retrieved
  arm cannot speak to retrieval (measured on the valid claims: 50% and 56%, so this is already satisfied).'
- 'Compute: the projection at the measured throughput exceeds the deadline after cut_order is applied. The study is stopped
  and reported.'
positive_fallback: If evidence does not brake misinformation in a channel beyond added text, or brakes it only by also blocking
  true corrections, the paper reports a supported negative or an honest inconclusive, with harmful and beneficial accounting
  for true peers only (there is no true-notes arm, so nothing is said about corrections from true notes), the position and
  format controls, and the vote comparison, which extends "One Axis, No Brake" (which names external evidence as a route forward).
  A row whose floor or room rule fires carries that label and is never reported as a negative.
alternative_explanations:
- name: block presence rather than content
  reading: Any block changes attention to the misinformation. C2 and C3 test content against a matched block, and gemma's
    feasibility pattern (drop vanishes under any block) is the reason per-model rows are mandatory.
- name: room to fall
  reading: A distractor lowers alone accuracy and leaves less to lose, which pushes C2 and C3 negative. C2h and C3h and the
    room-limited rule address it, without removing it.
- name: recency
  reading: Primary prompts end with the misinformation. C3_last tests the other order for gold evidence.
- name: one-word format
  reading: A forced one-word answer may keep a model from using the block. C3_reasoned tests the reasoned format for gold
    evidence.
- name: distractor content
  reading: Same-source distractors can contain unannotated evidence or misleading text. The block audit measures it and C2_clean
    and C3_clean test its effect; a judge can miss it, so the limit stays stated.
- name: stimulus selection
  reading: Validation keeps claims the writer can argue against, which are harder for the models and mostly TRUE. Effects
    can differ on claims a model knows, where false rationales could not be written and validated. experiments/selection.json
    measures the gap, per-label rows test the label mix, and conclusions name the validated claims.
- name: memorised labels
  reading: FEVER and SciFact are public. No-context alone accuracy is reported and the estimand is a within-regime change.
- name: rationale source
  reading: Rationales come from qwen3.6, which is also scored on them, and they passed a judge from another family. Per-model
    estimates sit beside every pooled row, and the paper states the affinity. They are published.
compute:
  where: Mac Studio M3 Ultra 96 GB, LM Studio, one model instance at a time
  budget_hours: 100
  budget_scope: 'On 840 validated claims the matrix is about 238,000 calls (scripted about 207,000, group about 30,000), S_controls
    about 54,000, and the selection check about 3,200 beyond cached answers. Measured on 2026-11-03 under contention at parallel
    4: gemma about 1 call per second, qwen3.6 about 3, and at parallel 2 coder-30b about 4. About 45 hours of wall clock.'
execution:
  command: python3 run_cell.py --method {method} --dataset {dataset} --seed {seed} --model {model} --out {out_dir}
  workdir: artifact
  note: The baselines stage runs one full-matrix cell per baseline and dataset (seed 1, pilot model for scripted baselines,
    fleet for group baselines). They are ordinary matrix cells and are not re-run.
